# Entorno de ai-course-notes, administrado con uv (`uv sync`).
#
# Sustituye a `requirements-web.txt`. Las dependencias de `cs336/` y
# `cs336-2026/` (torch, triton, einops, ...) no entran: son de los "executable
# lectures" oficiales que el repositorio conserva como fuente, no del pipeline.
[project]
name = "ai-course-notes"
version = "0.1.0"
description = "Notas de cursos de AI/LLM en LaTeX, con sitio de lectura en MkDocs."
requires-python = ">=3.11"
# El sitio de lectura (`tools/web/generate_site.py` + MkDocs) y el QA de PDF.
dependencies = [
    "mkdocs-material>=9.6,<10",
    "pymdown-extensions>=10.14,<11",
    "Pillow>=10,<12",
]

[dependency-groups]
# Las pruebas de `tests/`.
dev = ["pytest>=8"]
# El QA de idioma de las notas es-MX: lexico de 1 000 000 de formas del espanol.
lang = ["spacy-lookups-data>=1.0.5"]
# Descarga, slides y transcripcion: `download_all.sh`, las skills,
# `extract_slide_candidates.py` y `transcribe_faster_whisper.py`.
media = ["numpy>=1.26", "yt-dlp", "faster-whisper>=1.2"]
# `batch_transcribe.py`; instala torch, por eso va aparte y no por defecto.
openai-whisper = ["openai-whisper"]

[tool.uv]
# Lo que no es una biblioteca instalable: solo un entorno.
package = false
default-groups = ["dev", "lang"]
